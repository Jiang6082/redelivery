[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redelivery"
version = "0.1.0"
description = "A small durable event inbox with fenced leases and reproducible crash recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1,<2"]

[project.scripts]
redelivery = "redelivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redelivery = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["redelivery"]
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]
sigterm = true
